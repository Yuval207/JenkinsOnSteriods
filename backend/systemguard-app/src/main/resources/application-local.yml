# =============================================================================
# Local Development Profile
# =============================================================================
# Activate with: mvn spring-boot:run -Dspring-boot.run.profiles=local
# Uses local services without SSL/TLS (for when you run Docker locally)
# =============================================================================

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/systemguard
    username: systemguard
    password: systemguard
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

  data:
    redis:
      host: localhost
      port: 6379
      password:
      ssl:
        enabled: false

  kafka:
    bootstrap-servers: localhost:9092
    properties:
      security.protocol: PLAINTEXT
      sasl.mechanism:
      sasl.jaas.config:

# Point to local MinIO/LocalStack if running
systemguard:
  r2:
    endpoint: http://localhost:4566
    access-key: test
    secret-key: test
    bucket: systemguard-artifacts
